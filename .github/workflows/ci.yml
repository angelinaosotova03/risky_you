name: CI

# Проверки на каждый push и каждый pull request. Ничего не деплоит —
# только тесты, типы и сборка. Деплой — отдельный workflow (deploy.yml),
# который запускается ПОСЛЕ того, как этот полностью зазеленеет.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Тесты (vitest)
        run: npm test
      - name: Типы + сборка (tsc && vite build)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Импорт приложения (ловит синтаксические и импорт-ошибки)
        run: python -c "import app.main"

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ фронтенда
        run: docker build -t risky-you-frontend:ci ./frontend
      - name: Собрать образ бэкенда
        run: docker build -t risky-you-backend:ci ./backend
